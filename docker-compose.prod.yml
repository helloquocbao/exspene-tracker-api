version: '3.8'

services:
  db:
    image: postgres:15
    container_name: petgame-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: petgame
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: petgame-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@petgame.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  nestjs:
    build: .
    container_name: petgame-nestjs
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:123456@db:5432/petgame
    volumes:
      - .:/app
    command: ['npm', 'run', 'start:prod']
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
